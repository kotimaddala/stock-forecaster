[project]
name = "stock-opportunity-forecaster"
version = "1.0.0"
description = "Multi-agent stock thesis reviewer with Tree-of-Thoughts reasoning, retrieval and guardrails (paper trading only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]
graph = ["langgraph>=0.2"]
mcp = ["mcp>=1.12.3"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["forecaster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
